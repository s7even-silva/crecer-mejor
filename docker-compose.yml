services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: crecer_mejor
      POSTGRES_PASSWORD: crecer_mejor
      POSTGRES_DB: crecer_mejor
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crecer_mejor"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://crecer_mejor:crecer_mejor@db:5432/crecer_mejor
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
